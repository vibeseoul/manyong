<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Find Manyong! · vibe seoul</title>
<meta name="description" content="vibe seoul Halloween: find the three hidden Manyongs in our store on Zeil 68, Frankfurt.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0b0d">
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<style>
/* Layout: one phone-width column. A dark store-at-night ground, three white "plates" that hold the shadows, one gold secret below. Single dark look by choice. */
@font-face{font-family:"Henny Penny";src:url(fonts/hennypenny.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Bricolage Grotesque";src:url(fonts/bricolage-800.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url(fonts/instrument-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url(fonts/instrument-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url(fonts/instrument-600.woff2) format("woff2");font-weight:600 700;font-display:swap}
:root{
  --bg:#0c0b0d; --panel:#17151a; --line:#2c2930; --ink:#f4f2ef; --mute:#9b97a0;
  --plate:#f3f1ec; --plate-ink:#111; --red:#c4144b; --gold:#e3b34c; --gold-deep:#b8862a; --bad:#ff7a9c;
  --silver:linear-gradient(100deg,#c9c9cf 0%,#ffffff 35%,#a7a7ae 60%,#f1f1f4 100%);
  --kr:"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic";
  --f-display:"Henny Penny",var(--kr),system-ui,sans-serif; --dw:400; --dls:0;
  --f-brand:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Instrument Sans",var(--kr),system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
/* Korean has no Henny Penny glyphs: use the brand face there */
html[lang="ko"]{--f-display:"Bricolage Grotesque",var(--kr),system-ui,sans-serif;--dw:800;--dls:-.02em}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 40px;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}

.top{display:flex;justify-content:space-between;align-items:center;padding-top:18px}
.wordmark{font-family:var(--f-brand);font-weight:800;font-size:18px;letter-spacing:-.01em;background:var(--silver);-webkit-background-clip:text;background-clip:text;color:transparent;text-decoration:none}
.langs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{background:none;border:0;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--mute);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.hero{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
h1{font-family:var(--f-display);font-weight:var(--dw);font-size:clamp(34px,10vw,46px);line-height:1.05;letter-spacing:var(--dls);margin:0;text-wrap:balance}
.lead{margin:0;color:var(--mute);max-width:36ch}

.board{display:flex;flex-direction:column;gap:14px}
.progress{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--mute)}
.progress b{font-family:var(--f-display);font-weight:var(--dw);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .5s ease}
.plates{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.slot{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.plate{position:relative;width:100%;aspect-ratio:1;max-width:100%;border:0;border-radius:50%;background:var(--plate);display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08);transition:transform .15s;padding:0}
.plate:active{transform:scale(.96)}
.plate img{width:74%;height:74%;object-fit:contain}
.plate .q{position:absolute;right:6%;bottom:6%;width:26px;height:26px;border-radius:50%;background:var(--plate-ink);color:var(--plate);font-weight:700;font-size:13px;display:grid;place-items:center}
.plate.found .q{background:var(--red)}
.plate.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.plate.pop::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--red);animation:ring .7s ease-out forwards}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
@keyframes ring{0%{opacity:1;transform:scale(.9)}100%{opacity:0;transform:scale(1.25)}}
.slot small{font-size:12px;color:var(--mute);text-align:center}
.slot.done small{color:var(--ink);font-weight:600}
.tapnote{margin:0;font-size:13px;color:var(--mute);text-align:center}

.steps{list-style:none;margin:0;padding:18px 0 0;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;color:var(--mute)}
.steps li span{font-family:var(--f-display);font-weight:var(--dw);color:var(--ink)}

/* coupon */
.reward{background:var(--plate);color:var(--plate-ink);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.reward h2,.secret h2{font-family:var(--f-display);font-weight:var(--dw);font-size:28px;line-height:1.1;letter-spacing:var(--dls);margin:0;text-wrap:balance}
.reward .row{display:flex;gap:14px;align-items:center}
.reward .row img{width:76px;height:76px;object-fit:contain;flex:none;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.offer{font-size:18px;font-weight:600;min-width:0;display:flex;flex-direction:column;gap:2px}
.offer small{font-size:12px;font-weight:500;opacity:.6}
.sample{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;letter-spacing:.06em;border:1px dashed currentColor;border-radius:4px;padding:0 5px;vertical-align:middle;opacity:.6}
.ticket{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 10px;font-size:13px;border-top:1px dashed rgba(0,0,0,.25);padding-top:12px;font-variant-numeric:tabular-nums}
.ticket>span:first-child{grid-column:1/-1}
.ticket .code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:18px;font-weight:700;letter-spacing:.08em}
.ticket .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.hint{font-size:13px;opacity:.75;margin:0}
.staffbtn{border:0;border-radius:12px;background:var(--plate-ink);color:var(--plate);padding:14px;font-weight:600;font-size:14px;cursor:pointer}
.pinbox{display:flex;flex-direction:column;gap:8px}
.pinbox label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.pinrow{display:flex;gap:8px}
.pinrow input{flex:1;min-width:0;border:2px solid var(--plate-ink);border-radius:12px;background:#fff;color:var(--plate-ink);font:inherit;font-size:24px;font-weight:700;letter-spacing:.5em;text-align:center;padding:8px 0 8px .5em}
.pinrow button{border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:700;padding:0 18px;cursor:pointer}
.pinrow button.ghost{background:transparent;color:var(--plate-ink);border:2px solid rgba(0,0,0,.15)}
.pinerr{margin:0;font-size:13px;font-weight:600;color:var(--red);min-height:1.2em}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.stamp{align-self:center;margin-top:4px;transform:rotate(-6deg);border:3px solid var(--red);color:var(--red);border-radius:10px;padding:4px 10px;font-family:var(--f-display);font-weight:var(--dw);font-size:20px;letter-spacing:.04em;text-transform:uppercase;cursor:default;background:rgba(243,241,236,.9)}
.usedline{font-weight:600;color:var(--red);font-size:14px}
.reward.redeemed .row img{animation:none;filter:grayscale(1);opacity:.6}
.reward.redeemed .ticket .dot{animation:none;background:#999}
.ended{font-weight:600;font-size:14px}

.secret{border:1px solid var(--gold-deep);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;background:radial-gradient(120% 80% at 50% 0%,rgba(227,179,76,.14),transparent 70%),var(--panel)}
.secret .eyebrow{color:var(--gold)}
.secret p{margin:0;color:var(--mute);font-size:15px}
.secret .plate{max-width:150px;align-self:center;background:#201d17;box-shadow:0 0 0 2px var(--gold-deep),0 0 30px rgba(227,179,76,.25)}
.secret .plate.found{background:var(--plate)}
.secret .plate:not(.found) img{filter:brightness(.5);animation:shimmer 2.4s ease-in-out infinite}
@keyframes shimmer{50%{filter:brightness(1.2) drop-shadow(0 0 8px var(--gold))}}
.secret .reward{background:linear-gradient(135deg,#f6e3b0,#e3b34c 55%,#f3d78e)}
.secret .reward .stamp{background:rgba(246,227,176,.9)}
.secret .reward .eyebrow{color:#7a4f00}

footer{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:16px}
footer a{color:var(--ink);text-underline-offset:3px}

/* scanner sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{width:100%;max-width:480px;background:var(--panel);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h3{margin:0;font-family:var(--f-display);font-weight:var(--dw);font-size:22px}
.x{background:var(--line);border:0;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:18px}
.cam{position:relative;width:100%;aspect-ratio:1;max-width:100%;background:#000;border-radius:16px;overflow:hidden;display:grid;place-items:center}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;inset:18%;border:3px solid var(--ink);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mute);font-size:14px}
.alt{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-weight:600;cursor:pointer;font-size:15px}
.codeform{display:flex;gap:8px}
.codeform input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);font:inherit;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.codeform button{border:0;background:var(--ink);color:var(--bg);border-radius:12px;padding:0 18px;font-weight:700;cursor:pointer}
.err{margin:0;color:var(--bad);font-size:13px;min-height:1.2em}
.or{font-size:12px;color:var(--mute);text-align:center;letter-spacing:.1em;text-transform:uppercase}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}

/* staff reset panel (#reset) */
.staffpanel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.staffpanel .pinrow input{background:var(--bg);color:var(--ink);border-color:var(--line)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="wordmark" href="https://www.vibe-seoul.com/">vibe seoul</a>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="de">DE</button>
      <button type="button" data-lang="ko">KO</button>
    </div>
  </header>

  <section class="staffpanel" id="staffpanel" hidden>
    <strong data-t="resetTitle"></strong>
    <div class="pinrow"><input id="resetPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="PIN"><button type="button" id="resetGo" data-t="resetBtn"></button></div>
    <p class="err" id="resetErr"></p>
  </section>

  <section class="hero">
    <span class="eyebrow" data-t="eyebrow"></span>
    <h1 data-t="title"></h1>
    <p class="lead" data-t="lead"></p>
  </section>

  <section class="board" aria-live="polite">
    <div class="progress"><span data-t="found"></span><b id="count">0 / 3</b></div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="plates" id="plates"></div>
    <p class="tapnote" id="tapnote" data-t="tap"></p>
  </section>

  <section class="reward" id="reward" hidden></section>

  <section class="secret" id="secret" hidden>
    <span class="eyebrow" data-t="secretEyebrow"></span>
    <h2 data-t="secretTitle"></h2>
    <p data-t="secretHint"></p>
    <button type="button" class="plate" id="plate4" aria-label="Golden Manyong"><img alt=""></button>
    <section class="reward" id="bonus" hidden></section>
  </section>

  <ol class="steps" id="steps">
    <li><span>1</span><div data-t="s1"></div></li>
    <li><span>2</span><div data-t="s2"></div></li>
    <li><span>3</span><div data-t="s3"></div></li>
  </ol>

  <footer>
    <span data-t="foot"></span>
    <span data-t="privacy"></span>
    <span><a href="https://www.vibe-seoul.com/policies/legal-notice">Impressum</a> · <a href="https://www.vibe-seoul.com/policies/privacy-policy">Datenschutz</a> · <a href="https://www.vibe-seoul.com/">vibe-seoul.com</a> · <a href="https://www.instagram.com/vibe_seoul/">@vibe_seoul</a></span>
  </footer>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h3 id="sheetTitle" data-t="scanTitle"></h3><button type="button" class="x" id="close" aria-label="Close">×</button></div>
    <div class="cam"><video id="video" playsinline muted></video><div class="frame" id="frame" hidden></div><div class="msg" id="cammsg"></div></div>
    <div class="alt">
      <label class="btn" for="photo"><span data-t="photo"></span></label>
      <input type="file" id="photo" accept="image/*" capture="environment" hidden>
      <div class="or" data-t="or"></div>
      <form class="codeform" id="codeform" autocomplete="off">
        <input id="code" maxlength="8" aria-label="Code" autocapitalize="characters" spellcheck="false">
        <button type="submit">OK</button>
      </form>
      <p class="err" id="err"></p>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<template id="couponTpl">
  <span class="eyebrow" data-k="eyebrow"></span>
  <h2 data-k="title"></h2>
  <div class="row"><img alt="" data-k="img"><div class="offer"><span><span data-k="offer"></span><span class="sample" data-k="sample"></span></span><small data-k="valid"></small></div></div>
  <div class="ticket"><span><span class="dot"></span><span data-k="show"></span></span><span class="code" data-k="code"></span><span data-k="clock"></span></div>
  <p class="hint" data-k="hint"></p>
  <button type="button" class="staffbtn" data-k="staff"></button>
  <div class="pinbox" data-k="pinbox" hidden>
    <label data-k="pinLabel"></label>
    <div class="pinrow"><input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="PIN" data-k="pin"><button type="button" data-k="ok">OK</button><button type="button" class="ghost" data-k="cancel">×</button></div>
    <p class="pinerr" data-k="pinerr"></p>
  </div>
  <div class="usedline" data-k="used" hidden></div>
  <div class="ended" data-k="ended" hidden></div>
  <div class="stamp" data-k="stamp" hidden></div>
</template>

<script src="config.js"></script>
<script src="jsQR.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
